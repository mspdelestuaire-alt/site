<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Maison de santé pluriprofessionnelle de l'Estuaire : Gauriac, Blaye, Prignac-et-Marcamps (Gironde).">
<title>MSP de l'Estuaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: long scrolling single page, big rounded sections on a pale-green ground, sticky pill nav,
   estuary cover that drifts on scroll, content that rises into view. Cards swell on hover (desktop only). */
:root{
  --mist:#EEF6F0;      /* page ground, pale green */
  --sage:#D5E8DA;      /* section tint */
  --leaf:#2F7A69;      /* accent, teal from the logo */
  --leaf-d:#1F5C4F;    /* accent, pressed / links */
  --forest:#241650;    /* text, indigo from the logo */
  --muted:#55507A;     /* secondary text */
  --card:#FFFFFF;
  --sun:#F3C063;       /* single warm highlight */
  --line:#C9DECF;
  --logo-bg:#F3F2F9;
  --f-display:'Fraunces',Georgia,'Times New Roman',serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--mist);color:var(--forest);font-family:var(--f-body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:clamp(2rem,4.6vw,3.4rem);letter-spacing:-.01em}
h3{font-size:1.3rem}
p{margin:0}
a{color:var(--leaf-d)}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
section{padding-block:clamp(56px,9vw,120px);scroll-margin-top:84px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);margin-bottom:14px;display:block}
.lead{font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--muted);max-width:62ch;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:13px 22px;font:600 .95rem var(--f-body);text-decoration:none;border:2px solid var(--leaf);color:var(--leaf-d);background:transparent;cursor:pointer;transition:background .2s,color .2s,transform .2s}
.btn.solid{background:var(--leaf);color:#fff}
.btn:hover{background:var(--leaf-d);color:#fff;border-color:var(--leaf-d)}
.btn:focus-visible,a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.tbd{display:inline-block;background:#FFF1CF;color:#7A5200;border-radius:6px;padding:1px 8px;font-size:.82rem;font-weight:600}

/* nav */
header{position:fixed;inset:12px 0 auto 0;z-index:50;padding-inline:12px;pointer-events:none}
.nav{pointer-events:auto;max-width:1180px;margin-inline:auto;display:flex;align-items:center;gap:10px;background:rgba(238,246,240,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:8px 10px 8px 16px;box-shadow:0 6px 24px rgba(17,47,34,.08)}
.nav .cta{white-space:nowrap;padding:10px 18px;font-size:.88rem}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--forest);font:600 1.02rem var(--f-display);white-space:nowrap}
.brand img{width:36px;height:36px;flex:none;border-radius:50%;box-shadow:0 0 0 1.5px #B9B4D6}
.nav .cta{display:none}
.links{display:flex;gap:2px;margin-left:auto}
.links a{white-space:nowrap;padding:8px 10px;border-radius:999px;text-decoration:none;color:var(--forest);font-weight:600;font-size:.9rem}
.links a:hover{background:var(--sage)}
.lang{display:flex;background:var(--sage);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font:700 .8rem var(--f-body);color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--leaf);color:#fff}
.burger{display:none;border:0;background:var(--sage);width:40px;height:40px;border-radius:50%;cursor:pointer;color:var(--forest)}
@media(max-width:940px){
  .links{display:none;position:absolute;left:12px;right:12px;top:62px;flex-direction:column;background:var(--mist);border:1px solid var(--line);border-radius:24px;padding:10px;box-shadow:0 14px 30px rgba(17,47,34,.14)}
  .links.open{display:flex}
  .links a{padding:13px 16px}
  .burger{display:block;margin-left:auto}
  .lang{margin-left:0}
  .nav .cta{display:none}
}

/* hero */
.hero{position:relative;min-height:min(86vh,760px);display:flex;align-items:flex-end;padding:0;overflow:hidden;border-radius:0 0 44px 44px;background:#BFD9C7}
.hero-art{position:absolute;inset:-6% 0 -6% 0;will-change:transform}
.hero-art svg{width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,47,34,.0) 30%,rgba(17,47,34,.6) 100%),linear-gradient(90deg,rgba(17,47,34,.38),rgba(17,47,34,0) 62%)}
.hero-in{position:relative;z-index:2;color:#fff;padding-block:130px 64px;width:100%}
.hero h1{font-size:clamp(2.5rem,7vw,5.4rem);max-width:15ch;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(17,47,34,.35)}
.hero p{font-size:clamp(1.05rem,1.8vw,1.3rem);max-width:46ch;margin-top:18px;text-shadow:0 1px 14px rgba(17,47,34,.4)}
.hero .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero .btn{border-color:#fff;color:#fff}
.hero .btn.solid{background:#fff;color:var(--leaf-d)}
.hero .btn:hover{background:var(--sun);border-color:var(--sun);color:var(--forest)}
.pillars{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.pillars span{background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:7px 15px;font-size:.88rem;font-weight:600}

/* about */
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,72px);align-items:center}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.values{display:grid;gap:14px;margin-top:30px}
.value{background:var(--card);border-radius:22px;padding:20px 22px;display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line)}
.value i{flex:none;width:44px;height:44px;border-radius:14px;background:var(--sage);display:grid;place-items:center;color:var(--leaf-d)}
.value svg{width:24px;height:24px}
.value p{color:var(--muted);font-size:.97rem;margin-top:2px}
.frame{border-radius:36px;overflow:hidden;aspect-ratio:4/5;background:var(--sage);clip-path:inset(0 0 100% 0 round 36px);transition:clip-path 1.2s cubic-bezier(.2,.7,.2,1)}
.frame.in{clip-path:inset(0 0 0 0 round 36px)}
.frame svg{width:100%;height:100%;display:block;transform:scale(1.18);transition:transform 1.8s cubic-bezier(.2,.7,.2,1)}
.frame.in svg{transform:scale(1)}

/* cards, swell on hover for pointer devices only */
.grid{display:grid;gap:18px;margin-top:40px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;min-width:0}
@media(hover:hover) and (pointer:fine){
  .card:hover,.value:hover,.emerg:hover{transform:scale(1.04);box-shadow:0 22px 44px rgba(17,47,34,.14)}
  .person:hover .av{transform:scale(1.08)}
  .btn:hover{transform:scale(1.04)}
}
.value,.emerg{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.site h3{margin-bottom:4px}
.site .tag{font-size:.8rem;font-weight:700;color:var(--leaf);letter-spacing:.08em;text-transform:uppercase}
.site dl{margin:18px 0 20px;display:grid;gap:12px}
.site dt{font-size:.74rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.site dd{margin:2px 0 0;overflow-wrap:anywhere}
.site .acts{display:flex;flex-wrap:wrap;gap:8px}
.site .btn{padding:9px 15px;font-size:.88rem}

.tint{background:var(--sage);border-radius:44px;margin-inline:12px}
.tint .card,.tint .value{border-color:transparent}

/* team */
.pro-title{margin-top:44px;font:700 .8rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--leaf-d);display:flex;align-items:center;gap:12px}
.pro-title::after{content:"";height:1px;background:var(--line);flex:1}
.person{display:flex;gap:16px;align-items:center}
.av{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--sage);color:var(--leaf-d);font:600 1.15rem var(--f-display);transition:transform .35s}
.person b{display:block;font-weight:700;line-height:1.25}
.person small{color:var(--muted);font-size:.88rem}
.coord{margin-top:46px;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;background:var(--forest);color:#fff;border-radius:32px;padding:30px}
.coord .av{width:84px;height:84px;font-size:1.7rem;background:var(--sun);color:var(--forest)}
.coord p{color:#CFE3D6;margin-top:6px}
@media(max-width:560px){.coord{grid-template-columns:1fr}}

/* rdv strip */
.strip{background:var(--leaf);color:#fff;border-radius:40px;padding:clamp(30px,5vw,56px);display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;margin-inline:12px}
.strip h2{color:#fff;font-size:clamp(1.7rem,3.4vw,2.5rem);max-width:20ch}
.strip p{color:#DDEFE4;margin-top:8px;max-width:48ch}
.strip .btn{background:#fff;color:var(--leaf-d);border-color:#fff}
.strip .btn:hover{background:var(--sun);color:var(--forest);border-color:var(--sun)}

/* emergency */
.emerg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:36px}
.emerg{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;gap:14px;align-items:center}
.emerg b{font:600 1.9rem var(--f-display);color:var(--leaf-d);min-width:3.4ch}
.emerg span{font-size:.92rem;line-height:1.3}
.emerg.big{background:var(--forest);border-color:var(--forest);color:#fff}
.emerg.big b{color:var(--sun)}
.warn{margin-top:26px;background:#FFF1CF;color:#5A3F00;border-radius:18px;padding:14px 18px;font-size:.95rem}

/* news */
.news a{display:block;text-decoration:none;color:inherit;height:100%}
.news small{color:var(--leaf);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.74rem}
.news h3{margin:8px 0 6px}
.news p{color:var(--muted);font-size:.95rem}
.news .go{margin-top:14px;font-weight:700;color:var(--leaf-d);font-size:.92rem}

/* survey */
form{margin-top:34px;display:grid;gap:22px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend,label.l{font-weight:700;font-size:.95rem;padding:0}
.stars{display:flex;gap:6px}
.stars button{width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.25rem;cursor:pointer;color:#B3C7BA;transition:transform .15s,background .15s}
.stars button[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--forest)}
.stars button:hover{background:#FFE9B8}
.rows{display:grid;gap:16px}
.rowq{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 20px}
select,textarea{font:inherit;width:100%;padding:13px 15px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--forest)}
textarea{min-height:120px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--muted)}
.chk input{margin-top:5px;width:18px;height:18px;accent-color:var(--leaf)}
.thanks{background:var(--card);border-radius:28px;padding:34px;text-align:center;border:2px solid var(--leaf)}
.devnote{font-size:.8rem;color:var(--muted);margin-top:4px}

/* contact + footer */
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:34px}
.contact .card b{display:block;margin-bottom:6px}
.sel{user-select:all;overflow-wrap:anywhere}
footer{background:var(--forest);color:#CFE3D6;border-radius:44px 44px 0 0;padding-block:54px 40px;margin-top:80px}
footer .top{display:flex;flex-wrap:wrap;gap:30px;justify-content:space-between}
.logo-card{background:var(--logo-bg);border-radius:22px;padding:12px;display:inline-block}.logo-card img{display:block;width:min(300px,100%);height:auto}
footer ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 22px}
footer button.lnk{background:none;border:0;color:#CFE3D6;font:600 .92rem var(--f-body);cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:4px}
footer button.lnk:hover{color:#fff}
footer small{display:block;margin-top:30px;color:#93B3A1;font-size:.82rem}

/* legal overlay */
.ov{position:fixed;inset:0;z-index:100;background:rgba(17,47,34,.6);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.ov.open{display:flex}
.ov article{background:var(--mist);border-radius:28px;max-width:760px;width:100%;padding:clamp(22px,4vw,44px);position:relative}
.ov h2{font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:14px}
.ov h3{font-size:1.05rem;margin:22px 0 6px;font-family:var(--f-body);font-weight:700}
.ov p,.ov li{color:#2D4A3B;font-size:.96rem}
.ov ul{padding-left:20px;margin:6px 0}
.ov .x{position:sticky;float:right;top:0;border:0;background:var(--sage);width:42px;height:42px;border-radius:50%;font-size:1.3rem;cursor:pointer}

/* reveal */
.js .rv{opacity:0;transform:translateY(34px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.js .rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .rv{opacity:1;transform:none;transition:none}
  .frame{clip-path:none;transition:none}.frame svg{transform:none;transition:none}
  .hero-art{transform:none!important}
}
</style>
</head>

var LEGAL={
legal:{fr:'<h2>Mentions légales</h2><h3>Éditeur du site</h3><p>ASSOCIATION DE LA MSP DE L’ESTUAIRE<br>2 rue de la Plaine, 33710 Gauriac<br>SIRET : 988 696 944 00012<br>E-mail : mspdelestuaire@gmail.com</p><h3>Directeur de la publication</h3><p>Kinley Manga, coordinateur de la MSP.</p><h3>Hébergeur</h3><p>GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, États-Unis (site github.com).<br>Nom de domaine : OVH SAS, 2 rue Kellermann, 59100 Roubaix, France.</p><h3>Activité et déontologie</h3><p>Les professionnels de santé présentés sur ce site exercent à titre libéral et sont soumis au code de la santé publique et à leur code de déontologie. Ils sont inscrits auprès de leur ordre professionnel. Les informations publiées sont d’ordre général, à vocation d’information du public, et ne remplacent pas une consultation.</p><h3>Propriété intellectuelle</h3><p>Les textes, illustrations et le logo de ce site sont la propriété de l’association, sauf mention contraire. Toute reproduction sans autorisation est interdite.</p><h3>Liens externes</h3><p>Le site renvoie vers des sites tiers (Doctolib, Assurance Maladie, etc.) dont l’association n’a pas la maîtrise du contenu.</p><h3>Droit applicable</h3><p>Le site est soumis au droit français.</p>',
 en:'<h2>Legal notice</h2><h3>Publisher</h3><p>ASSOCIATION DE LA MSP DE L’ESTUAIRE<br>2 rue de la Plaine, 33710 Gauriac, France<br>SIRET: 988 696 944 00012<br>Email: mspdelestuaire@gmail.com</p><h3>Publication director</h3><p>Kinley Manga, coordinator of the MSP.</p><h3>Hosting provider</h3><p>GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA (github.com).<br>Domain name: OVH SAS, 2 rue Kellermann, 59100 Roubaix, France.</p><h3>Activity and ethics</h3><p>The health professionals presented here practise independently and are bound by the French Public Health Code and their professional code of ethics. Information is general and does not replace a consultation.</p><h3>Intellectual property</h3><p>Texts, illustrations and the logo belong to the association unless stated otherwise. Reproduction without permission is prohibited.</p><h3>External links</h3><p>This site links to third-party sites (Doctolib, health insurance, etc.) whose content the association does not control.</p><h3>Governing law</h3><p>This site is governed by French law.</p>'},
privacy:{fr:'<h2>Politique de confidentialité</h2><p>Cette page explique comment sont traitées vos données personnelles, conformément au règlement général sur la protection des données (RGPD) et à la loi Informatique et Libertés.</p><h3>Responsable du traitement</h3><p>ASSOCIATION DE LA MSP DE L’ESTUAIRE, 2 rue de la Plaine, 33710 Gauriac. Contact : mspdelestuaire@gmail.com.</p><h3>Données et finalités</h3><ul><li><b>Questionnaire de satisfaction</b> : site fréquenté, notes, commentaire libre. Finalité : améliorer l’accueil et suivre la qualité du service. Le questionnaire est anonyme et ne demande ni nom ni coordonnées. Base légale : votre consentement.</li><li><b>Courriers électroniques</b> : si vous nous écrivez, nous utilisons votre adresse pour vous répondre. Base légale : intérêt légitime à répondre aux demandes.</li></ul><p>Merci de ne pas indiquer d’information de santé permettant de vous identifier dans les champs libres. Pour toute demande médicale, contactez un cabinet.</p><h3>Destinataires</h3><p>Les membres de l’équipe en charge de la qualité et de la coordination, et les prestataires techniques qui hébergent le site (GitHub) et le formulaire de satisfaction (Google Forms).</p><h3>Durée de conservation</h3><p>Les réponses au questionnaire sont conservées 24 mois puis supprimées ou agrégées de façon anonyme. Les courriers sont conservés le temps du traitement de la demande.</p><h3>Vos droits</h3><p>Vous pouvez demander l’accès, la rectification, l’effacement, la limitation de vos données, vous opposer à leur traitement ou retirer votre consentement, en écrivant à mspdelestuaire@gmail.com. Vous pouvez introduire une réclamation auprès de la CNIL (www.cnil.fr).</p><h3>Transferts hors Union européenne</h3><p>Le site est hébergé par GitHub, Inc. et le questionnaire de satisfaction est traité par Google Ireland Limited, filiales de sociétés établies aux États-Unis. Des transferts de données peuvent donc avoir lieu hors de l’Union européenne ; ils sont encadrés par les clauses contractuelles types de la Commission européenne ou par le Data Privacy Framework UE–États-Unis, selon le prestataire. Le questionnaire étant anonyme, aucune donnée de santé nominative n’est attendue.</p>',
 en:'<h2>Privacy policy</h2><p>This page explains how your personal data is handled, in line with the GDPR and the French Data Protection Act.</p><h3>Data controller</h3><p>ASSOCIATION DE LA MSP DE L’ESTUAIRE, 2 rue de la Plaine, 33710 Gauriac, France. Contact: mspdelestuaire@gmail.com.</p><h3>Data and purposes</h3><ul><li><b>Satisfaction survey</b>: site visited, ratings, free comment. Purpose: improve the welcome and monitor service quality. The survey is anonymous and asks for no name or contact details. Legal basis: your consent.</li><li><b>Emails</b>: if you write to us, we use your address to reply. Legal basis: legitimate interest in answering requests.</li></ul><p>Please do not write health information that could identify you in free-text fields.</p><h3>Recipients</h3><p>Team members in charge of quality and coordination, and the technical providers hosting the site (GitHub) and the satisfaction survey (Google Forms).</p><h3>Retention</h3><p>Survey answers are kept 24 months, then deleted or anonymised. Emails are kept as long as needed to handle the request.</p><h3>Your rights</h3><p>You may request access, rectification, erasure or restriction, object to processing or withdraw consent by writing to mspdelestuaire@gmail.com. You may lodge a complaint with the CNIL (www.cnil.fr).</p><h3>Transfers outside the EU</h3><p>The site is hosted by GitHub, Inc. and the satisfaction survey is processed by Google Ireland Limited, subsidiaries of companies established in the United States. Data may therefore be transferred outside the European Union, under the European Commission’s standard contractual clauses or the EU–US Data Privacy Framework, depending on the provider. As the survey is anonymous, no identifiable health data is expected.</p>'},
cookies:{fr:'<h2>Cookies et traceurs</h2><p>Ce site n’utilise aucun cookie publicitaire ni outil de mesure d’audience. Il conserve uniquement, dans votre navigateur, votre choix de langue (français ou anglais) pour vous éviter de le refaire. Ce stockage est strictement nécessaire à ce service et ne demande donc pas de consentement.</p><p>Si un outil de mesure d’audience ou un contenu intégré (carte, vidéo) était ajouté plus tard, une bannière de consentement serait mise en place au préalable.</p>',
 en:'<h2>Cookies and trackers</h2><p>This site uses no advertising cookies and no analytics. It only stores your language choice (French or English) in your browser so you do not have to repeat it. This storage is strictly necessary for the service and does not require consent.</p><p>If analytics or embedded content (map, video) were added later, a consent banner would be set up beforehand.</p>'},
access:{fr:'<h2>Accessibilité</h2><p>Nous voulons que ce site soit utilisable par tous : contrastes lisibles, navigation au clavier, textes adaptables, animations réduites si votre appareil le demande. Si vous rencontrez une difficulté, écrivez-nous à mspdelestuaire@gmail.com : nous vous proposerons une autre manière d’obtenir l’information.</p>',
 en:'<h2>Accessibility</h2><p>We want this site to be usable by everyone: readable contrast, keyboard navigation, scalable text, reduced motion when your device asks for it. If you run into a problem, write to mspdelestuaire@gmail.com and we will offer another way to get the information.</p>'}

var lang='fr';
try{var s=localStorage.getItem('msp_lang');if(s==='en'||s==='fr')lang=s;}catch(e){}
var t=function(k){return (T[lang]&&T[lang][k]!==undefined)?T[lang][k]:(T.fr[k]||'')};
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(x){return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

function mapQ(s){var m=(s.addrs||[]).filter(function(x){return x.main})[0];return encodeURIComponent(m?m.t:(s.zip+' '+s.city))}
function renderSites(){
  $('#sites').innerHTML=SITES.map(function(s,i){
    var addr=s.addrs.length?s.addrs.map(function(x){return '<span style="display:block;margin-bottom:6px"><small style="display:block;color:var(--muted);font-size:.8rem">'+esc(x.l[lang])+'</small>'+esc(x.t)+(x.check?' <span class="tbd">'+t('verify')+'</span>':'')+'</span>'}).join(''):'<span class="tbd">'+t('tbd')+'</span><br>'+s.zip+' '+esc(s.city);
    var hrs=s.hours?esc(s.hours[lang]).replace(/\n/g,'<br>'):'<span class="tbd">'+t('tbd')+'</span>';
    var ph=s.phone?'<span class="sel">'+esc(s.phone)+'</span>':'<span class="tbd">'+t('tbd')+'</span>';
    var acc=s.access?esc(s.access[lang]):'<span class="tbd">'+t('tbd')+'</span> <small style="display:block;color:var(--muted);margin-top:4px">'+t('access_hint')+'</small>';
    return '<article class="card site rv" style="--d:'+(i*.08)+'s"><span class="tag">'+esc(s.tag[lang])+'</span><h3>'+esc(s.name)+'</h3><dl><div><dt>'+t('addr')+'</dt><dd>'+addr+'</dd></div><div><dt>'+t('hours')+'</dt><dd>'+hrs+'</dd></div><div><dt>'+t('phone')+'</dt><dd>'+ph+'</dd></div><div><dt>'+t('access')+'</dt><dd>'+acc+'</dd></div></dl><div class="acts"><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+mapQ(s)+'">'+t('gmaps')+'</a><a class="btn" target="_blank" rel="noopener" href="https://waze.com/ul?q='+mapQ(s)+'&navigate=yes">'+t('waze')+'</a></div></article>';
  }).join('');
}
var PREV=[['f','M12 21s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.4-7 10-7 10z'],['d','M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z'],['w','M12 5v14M5 12h14'],['s','M12 3 4 6v6c0 5 3.500 8 8 9 4.500-1 8-4 8-9V6l-8-3zM9 12l2 2 4-4'],['v','M9 3h6v4l3 3v11H6V10l3-3V3zM6 14h12'],['b','M5 4h14v16H5zM9 9h6M9 13h6M9 17h3']];
function renderPrev(){

    return '<article class="card rv" style="--d:'+((i%3)*.07)+'s"><div class="value" style="border:0;padding:0;background:none;box-shadow:none"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+p[1]+'"/></svg></i></div><h3 style="margin:14px 0 6px">'+t('pv_'+p[0]+'_h')+'</h3><p style="color:var(--muted);font-size:.96rem">'+t('pv_'+p[0]+'_p')+'</p></article>';
  }).join('');
}
function initials(n){var w=n.replace(/^Dr /,'').split(' ');return (w[0][0]+(w[w.length-1][0]||'')).toUpperCase()}
function renderTeam(){
  var all=[];TEAM.forEach(function(g){g.p.forEach(function(p){all.push([p,g.g])})});
  $('#team').innerHTML='<div class="grid g3">'+all.map(function(x,i){
    var p=x[0];return '<div class="card person rv" style="--d:'+((i%3)*.07)+'s"><div class="av">'+initials(p[0])+'</div><div><b>'+esc(p[0])+'</b><small>'+esc(ROLE[x[1]][lang])+(p[1]?' · '+esc(p[1]):'')+'</small></div></div>';
  }).join('')+'</div>';
}
function renderEmerg(){
  $('#emerg').innerHTML=EMERG.map(function(e,i){
    var num=e[0],label=(i===0)?t('em15'):(num==='112'?t('em112'):t('em'+num+'b'));
    return '<div class="emerg rv'+(e[3]?' big':'')+'" style="--d:'+(i*.04)+'s"><b>'+num+'</b><span>'+esc(label)+'</span></div>';
  }).join('');
}
function renderNews(){
  $('#news').innerHTML=NEWS.map(function(n,i){
    return '<article class="card rv" style="--d:'+(i*.07)+'s"><a href="'+n.u+'" target="_blank" rel="noopener"><small>'+n.s+'</small><h3>'+t('n'+n.k+'_h')+'</h3><p>'+t('n'+n.k+'_p')+'</p><div class="go">'+t('read')+' →</div></a></article>';
  }).join('');
}
var LIVE=[];
function renderLive(){
  var el=$('#newsLive');if(!LIVE.length){el.innerHTML='';el.style.display='none';return}
  el.style.display='';
  el.innerHTML=LIVE.slice(0,6).map(function(n,i){
    var d='';try{d=new Date(n.date).toLocaleDateString(lang==='fr'?'fr-FR':'en-GB',{day:'numeric',month:'long'})}catch(e){}
    return '<article class="card rv" style="--d:'+((i%3)*.07)+'s"><a href="'+esc(n.link)+'" target="_blank" rel="noopener"><small>'+esc(n.source||'')+(d?' · '+d:'')+'</small><h3 style="font-size:1.08rem;margin-top:8px">'+esc(n.title)+'</h3><div class="go">'+t('read')+' →</div></a></article>';
  }).join('');observe();
}
try{fetch('news.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():[]}).then(function(a){if(Array.isArray(a)){LIVE=a;renderLive()}}).catch(function(){})}catch(e){}
var scores={};
function renderRows(){
  $('#sv_rows').innerHTML=['q1','q2','q3'].map(function(q){
    var st='';for(var i=1;i<=5;i++)st+='<button type="button" data-q="'+q+'" data-v="'+i+'" aria-pressed="'+(scores[q]>=i)+'" aria-label="'+i+'/5">★</button>';
    return '<div class="rowq"><span class="l" style="font-weight:700">'+t(q)+'</span><div class="stars">'+st+'</div></div>';
  }).join('');
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'))});
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===lang))});
  renderSites();renderPrev();renderTeam();renderEmerg();renderNews();renderRows();renderLive();observe();
  document.title=lang==='fr'?'MSP de l’Estuaire : maison de santé en Haute-Gironde':'MSP de l’Estuaire: health centre in Haute-Gironde';
}
document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){lang=b.dataset.lang;try{localStorage.setItem('msp_lang',lang)}catch(e){}applyLang();if(ovKey)openOv(ovKey)})});

/* reveal on scroll */
var io=null;
function observe(){
  var els=document.querySelectorAll('.rv:not(.in),.frame:not(.in)');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
  if(!io)io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  els.forEach(function(e){io.observe(e)});
}
/* hero drift */
var art=$('#heroArt');
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  var tick=false;
  addEventListener('scroll',function(){if(tick)return;tick=true;requestAnimationFrame(function(){var y=Math.min(scrollY,900);art.style.transform='translate3d(0,'+(y*.22)+'px,0) scale('+(1+y*.00018)+')';tick=false})},{passive:true});
}
/* procedural water + reeds */
(function(){
  var ns='http://www.w3.org/2000/svg',a=$('#rip'),b=$('#rip2'),r=$('#reeds'),seed=7;
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
  for(var i=0;i<70;i++){var y=552+Math.pow(rnd(),1.6)*300,sc=(y-545)/355,x=rnd()*1600,w=(30+rnd()*150)*(.4+sc*1.6);
    var p=document.createElementNS(ns,'path');p.setAttribute('d','M'+x+' '+y+'h'+w);p.setAttribute('stroke-width',(1+sc*3.5).toFixed(1));p.setAttribute('opacity',(.25+rnd()*.55).toFixed(2));(i%3?a:b).appendChild(p)}
  for(var j=0;j<150;j++){var x2=rnd()*1600,h=40+rnd()*110,base=868+rnd()*30,lean=(rnd()-.5)*30;
    var q=document.createElementNS(ns,'path');q.setAttribute('d','M'+x2+' '+base+' q'+(lean/2)+' '+(-h/2)+' '+lean+' '+(-h)+' l3 0 q'+(-lean/2+2)+' '+(h/2)+' '+(-lean+2)+' '+h+'z');r.appendChild(q)}
})();

/* survey */
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('.stars button');
  if(b){scores[b.dataset.q]=+b.dataset.v;renderRows()}
});
$('#survey').addEventListener('submit',function(e){
  e.preventDefault();
  if(!$('#sv_ok').checked){$('#sv_err').textContent=t('sv_need');return}
  $('#sv_err').textContent='';
  if(FORMS.action){
    try{
      var fd=new FormData(),v={site:$('#sv_site').value,q1:scores.q1||'',q2:scores.q2||'',q3:scores.q3||'',msg:$('#sv_msg').value};
      Object.keys(FORMS.entries).forEach(function(k){if(FORMS.entries[k])fd.append(FORMS.entries[k],v[k])});
      fetch(FORMS.action,{method:'POST',mode:'no-cors',body:fd}).catch(function(){});
    }catch(err){}
  }
  $('#survey').hidden=true;$('#thanks').hidden=false;
});

/* legal overlay */
var ovKey=null,lastFocus=null;
function openOv(k){ovKey=k;lastFocus=document.activeElement;$('#ovb').innerHTML=LEGAL[k][lang];$('#ov').classList.add('open');$('#ovx').focus()}
function closeOv(){ovKey=null;$('#ov').classList.remove('open');if(lastFocus)lastFocus.focus()}
document.querySelectorAll('[data-open]').forEach(function(b){b.addEventListener('click',function(){openOv(b.dataset.open)})});
$('#ovx').addEventListener('click',closeOv);
$('#ov').addEventListener('click',function(e){if(e.target.id==='ov')closeOv()});
addEventListener('keydown',function(e){if(e.key==='Escape'&&ovKey)closeOv()});

/* mobile menu */
var bg=$('#burger'),lk=$('#links');
bg.addEventListener('click',function(){var o=lk.classList.toggle('open');bg.setAttribute('aria-expanded',String(o))});
lk.addEventListener('click',function(e){if(e.target.tagName==='A'){lk.classList.remove('open');bg.setAttribute('aria-expanded','false')}});

$('#yr').textContent=new Date().getFullYear();
applyLang();
})();
</script>
</body>
</html>
